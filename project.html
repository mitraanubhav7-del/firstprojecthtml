<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Form</title> 
</head> 
<body> 
    <h1>University Registration Form</h1> 
    <p> 
     Please fill out this form below to register 
    </p> 
    <hr> 
<h2>Personal Details</h2> 
<form> 
    <label for="name">First Name: </label> 
    <input type="text" name="first_name" id="name" placeholder="e.g: Arjun"> 
    <br><br> 

    <label for="surname">Last Name: </label> 
    <input type="text" name="last_name" id="surname" placeholder="e.g: Singh"> 
    <br><br> 

    <label for="birth">DOB: </label> 
    <input type="date" name="date" id="birth" placeholder="e.g: dd/mm/yy"> 
</form> 
<br> 
<h3>Gender:</h3> 
<form> 
    <label for="male">Male: </label> 
    <input type="radio" name="gender" id="male" value="Male"> 
    <br> 
    <label for="female">Female: </label> 
    <input type="radio" name="gender" id="female" value="Female"> 
    <br> 
    <label for="other">Other: </label> 
    <input type="radio" name="gender" id="other" value="Other"> 
    <br><br> 
    <h4>Upload your photo: </h4> 
    <input type="file" id="photo" name="photo"> 
</form> 
<br> 
<hr> 
<h2>Contact Information</h2> 
<form> 
    <label for="email">Email Adress</label> 
    <input type="email" placeholder="you@example.com" id="email" name="email">  
    <br> 
    <br> 
    <label for="phone">Phone</label> 
    <input type="number" placeholder="(91)-.........." id="phone" name="phone no">  
    <br><br> 
    <label for="Adress">Mailing Adress</label> 
    <br>
    <textarea name="Adress" rows="5" placeholder=" Street Address,City, State,Zip Code"></textarea> 
</form> 
<br> 
<hr> 
<h2>Acedemic Information</h2> 
<label for="course">Select Your Course</label> 
<select name="course" id="course"> 
    <option value="Cse">Cse</option> 
    <option value="Me">Me</option> 
    <option value="Ee">Ee</option> 
</select>  
<h4>Extracurricular Acivities</h4> 
<form> 
    <label for="Sports">Sports</label> 
    <input type="checkbox" id="Sports" name="activities" value="sports"> 
    <br> 
    <label for="music">Music & Arts</label> 
    <input type="checkbox" id="music" name="activities" value="music"> 
    <br> 
    <label for="tec">Technology</label> 
    <input type="checkbox" id="tec" name="activities" value="tec"> 
    <br> 
    <label for="vol">Volunteering</label> 
    <input type="checkbox" id="vol" name="activities" value="vol"> 
</form> 
<br> 
<hr> 
<form> 
<h2>Create Your Account</h2> 
<label for="pass">Create a password</label> 
<input type="password" id="pass" name="password" placeholder="password"> 
<br><br> 
<label for="sec">Security Questions</label> 
<select name="sec" id="sec"> 
    <option value="pet_name">Pets Name</option> 
    <option value="parents_name">Your Parents Name</option> 
</select> 
<br><br> 
<label for="que">Security Answer:</label> 
<input type="text" id="que" name="security_answer"> 
<br><br> 
<input type="submit" value="Register"> 
<input type="reset" value="Reset"> 
</form> 

</body> 
</html>
